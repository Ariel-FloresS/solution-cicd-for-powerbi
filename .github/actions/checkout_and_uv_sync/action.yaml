name: Setup Python environment
description: Checkout the repository and install project dependencies with uv.

inputs:
  fetch-depth:
    description: >
      Commits to fetch. Must be 0 for any job that diffs against another
      ref: without full history git returns an empty diff, which is
      indistinguishable from no changes. Use 1 for jobs that only read
      files at the current commit.
    required: false
    default: "0"

runs:
  using: composite

  steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        enable-cache: true

    - name: Sync dependencies
      shell: bash
      run: uv sync --locked