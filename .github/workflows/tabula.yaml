name: Explore Tabular Editor


on:
  workflow_dispatch:
    inputs:
      model_path:
        description: "Path to the .SemanticModel folder, e.g. Workspace1/Ventas_Mensual.SemanticModel"
        required: true
        type: string

permissions:
  contents: read

jobs:
  explore:
    runs-on: windows-latest

    env:
      MODEL: ${{ inputs.model_path }}
      RULES: src/tabula/BPARules_by_name.json

    steps:
      
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      
      - name: Verify paths exist
        run: |
          Write-Host "Model : $env:MODEL"
          Write-Host "Rules : $env:RULES"

          if (-not (Test-Path $env:MODEL)) {
            Write-Host "::error::Model folder not found: $env:MODEL"
            exit 1
          }
          if (-not (Test-Path $env:RULES)) {
            Write-Host "::error::Rules file not found: $env:RULES"
            exit 1
          }

          Write-Host "--- model folder contents ---"
          Get-ChildItem $env:MODEL -Recurse -Depth 2 | Select-Object FullName

      
      - name: Download Tabular Editor 2
        run: |
          Invoke-WebRequest `
            "https://github.com/TabularEditor/TabularEditor/releases/latest/download/TabularEditor.Portable.zip" `
            -OutFile te2.zip
          Expand-Archive te2.zip -DestinationPath te2
          Get-ChildItem te2

      
      - name: Version and help
        continue-on-error: true
        run: .\te2\TabularEditor.exe -?

     

      - name: "Probe A: point at the folder, with -G"
        continue-on-error: true
        run: .\te2\TabularEditor.exe "$env:MODEL" -A "$env:RULES" -G

      - name: "Probe B: point at model.tmdl, with -G"
        continue-on-error: true
        run: .\te2\TabularEditor.exe "$env:MODEL\definition\model.tmdl" -A "$env:RULES" -G

      
      - name: "Probe C: point at the folder, no -G"
        continue-on-error: true
        run: .\te2\TabularEditor.exe "$env:MODEL" -A "$env:RULES"

      
      - name: "Probe D: capture raw output to a file"
        continue-on-error: true
        run: |
          .\te2\TabularEditor.exe "$env:MODEL" -A "$env:RULES" *> bpa-raw.txt
          Write-Host "--- exit code: $LASTEXITCODE ---"
          Write-Host "--- raw output ---"
          Get-Content bpa-raw.txt

      - name: Upload raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpa-raw-output
          path: bpa-raw.txt
          if-no-files-found: warn