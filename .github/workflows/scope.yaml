name: Scope
run-name: Detect changed items



on:

  workflow_call:
    
    inputs:
      base_ref:
        description: Comparison ref. Use origin/<base> on a pull request, HEAD~1 on main.
        required: true
        type: string

    outputs:

      workspace:
        description: Name of the single workspace folder the pull request touched.
        value: ${{ jobs.scope.outputs.workspace }}

      has_changes:
        description: String flag, 'true' or 'false'. Compare against the quoted string.
        value: ${{ jobs.scope.outputs.has_changes }}

      semantic_models:
        description: JSON array of changed .SemanticModel paths. Unwrap with fromJson.
        value: ${{ jobs.scope.outputs.semantic_models }}

      reports:
        description: JSON array of changed .Report paths. Unwrap with fromJson.
        value: ${{ jobs.scope.outputs.reports }}



jobs:
  scope:
    
    runs-on: ubuntu-latest

    outputs:
      workspace: ${{ steps.detect.outputs.workspace }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      semantic_models: ${{ steps.detect.outputs.semantic_models }}
      reports: ${{ steps.detect.outputs.reports }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/uv_sync
        
      - name: Detect changed Power BI items
        id: detect
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          uv run python -m pbi_cicd.scope \
            --base "$BASE_REF" \
            --report "$RUNNER_TEMP/report-scope.txt"

      # Picked up by the gate job for the consolidated report.
      - name: Upload report section
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-scope
          path: ${{ runner.temp }}/report-scope.txt
          retention-days: 1
          if-no-files-found: ignore
