name: Pull Request Gate
run-name: Pull Request Gate

on:
  workflow_call:

    inputs:

      needs:
        description: toJSON(needs) from the calling workflow, so the gate sees every job's result.
        type: string
        required: true

      
      pr:
        description: Number of the pull request to merge or close.
        type: string
        required: true

    
      request_id:
        description: Delivery ID from the zip intake, if any.
        type: string
        required: false
        default: ""

jobs:

  # The required status check for branch protection. Merging happens in a
  # separate job: while this one runs its check is still in progress, and
  # branch protection would refuse a merge it requested itself.
  evaluate:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write

    env:
      REPORT: pipeline-report-${{ inputs.request_id || format('pr-{0}', inputs.pr) }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/uv_sync

      # Each artifact lands in a folder named after it. The BPA sections all
      # carry the same file name, so merging them into one folder would
      # keep only the last.
      - name: Download report sections
        uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: ${{ runner.temp }}/sections

      - name: Decide
        env:
          NEEDS: ${{ inputs.needs }}
          PR: ${{ inputs.pr }}
        run: |
          uv run python -m pbi_cicd.gate \
            --needs "$NEEDS" \
            --sections "$RUNNER_TEMP/sections" \
            --pr "$PR" \
            --run-id "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/$REPORT.txt"

      - name: Upload consolidated report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPORT }}
          path: ${{ runner.temp }}/${{ env.REPORT }}.txt
          retention-days: 2
          if-no-files-found: ignore

      # Best effort: a cleanup failure must not block a merge. The sections
      # expire after a day regardless.
      - name: Delete report sections
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | startswith("report-")) | .id' |
          while read -r id; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done

  merge:
    needs: evaluate
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    outputs:
      dashboard: ${{ steps.title.outputs.dashboard }}

    steps:

      # The zip intake titles each pull request after its dashboard. Read
      # before merging, for the success message the publish job writes.
      - name: Read the dashboard name
        id: title
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: echo "dashboard=$(gh pr view "$PR" --json title --jq .title)" >> "$GITHUB_OUTPUT"

      - name: Squash merge the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: gh pr merge "$PR" --squash --delete-branch
  
  close:
    needs: evaluate
    if: failure()
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Close the pull request and delete its branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          REPORT: pipeline-report-${{ inputs.request_id || format('pr-{0}', inputs.pr) }}

        run: |
          gh pr close "$PR" --delete-branch --comment \
          "Closed by the pipeline: at least one check failed. The details are in the $REPORT artifact of this run."

  # Tells Data Factory how a delivery ended. Success means merged, not merely
  # validated: a dashboard that passed every check but could not be merged
  # is a failure for whoever is waiting on it. Pull requests opened by people
  # carry no request ID and publish nothing.
  publish:
    needs: [evaluate, merge, close]
    if: always() && inputs.request_id != ''

    permissions:
      id-token: write

    uses: ./.github/workflows/publish_result.yaml
    with:
      request_id: ${{ inputs.request_id }}
      outcome: ${{ needs.merge.result == 'success' && 'success' || 'failure' }}
      dashboard: ${{ needs.merge.outputs.dashboard }}
      report_artifact: pipeline-report-${{ inputs.request_id }}