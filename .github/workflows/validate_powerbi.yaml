name: Validate the .pbip Artefacts
run-name: Validate PowerBI Artefacts



on:
  workflow_call:

    inputs:

      workspace:
        description: Name of the single workspace folder the pull request touched.
        type: string
        required: true

      semantic_models:
        description: JSON array of changed .SemanticModel paths.
        type: string
        required: true

      reports:
        description: JSON array of changed .Report paths.
        type: string
        required: true



jobs:
  validate:
    runs-on: ubuntu-latest

    
    env:
      WORKSPACE: ${{ inputs.workspace }}
      SEMANTIC_MODELS: ${{ inputs.semantic_models }}
      REPORTS: ${{ inputs.reports }}

    steps:
     
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/uv_sync

     
      # last. Every step carries  if : always() so one failure does not
      # hide the rest — the author fixes everything in one push instead
      # of discovering problems one at a time.
      
      # Without pipefail the step would take tee's exit code, which is
      # always 0, and a broken rule would pass.
      - name: "Rule 4: item folder names must use safe characters"
        run: |
          set -o pipefail
          uv run python -m pbi_cicd.rules.name --models "$SEMANTIC_MODELS" --reports "$REPORTS" 2>&1 | tee -a "$RUNNER_TEMP/report-validate.txt"

      - name: "Rule 5: display names must be unique within a workspace"
        if: always()
        run: |
          set -o pipefail
          uv run python -m pbi_cicd.rules.identity --workspace "$WORKSPACE" 2>&1 | tee -a "$RUNNER_TEMP/report-validate.txt"

      - name: "Rule 6: semantic models must not read from local paths"
        if: always()
        run: |
          set -o pipefail
          uv run python -m pbi_cicd.rules.sources --models "$SEMANTIC_MODELS" 2>&1 | tee -a "$RUNNER_TEMP/report-validate.txt"

      # Picked up by the gate job for the consolidated report.
      - name: Upload report section
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-validate
          path: ${{ runner.temp }}/report-validate.txt
          retention-days: 1
          if-no-files-found: ignore