name: Validate the .pbip Artefacts
run-name: Validate PowerBI Artefacts



on:
  workflow_call:

    inputs:

      workspace:
        description: Name of the single workspace folder the pull request touched.
        type: string
        required: true

      semantic_models:
        description: JSON array of changed .SemanticModel paths.
        type: string
        required: true

      reports:
        description: JSON array of changed .Report paths.
        type: string
        required: true



jobs:
  validate:
    runs-on: ubuntu-latest

    
    env:
      WORKSPACE: ${{ inputs.workspace }}
      SEMANTIC_MODELS: ${{ inputs.semantic_models }}
      REPORTS: ${{ inputs.reports }}

    steps:
     
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/uv_sync


      # One command runs rules 4 to 6 and reports every problem they find,
      # so the author fixes them all in one push.
      - name: "Rules 4 to 6: validate artefacts"
        run: |
          uv run python -m pbi_cicd.validate \
            --workspace "$WORKSPACE" \
            --models "$SEMANTIC_MODELS" \
            --reports "$REPORTS" \
            --report "$RUNNER_TEMP/report-validate.txt"

      # Picked up by the gate job for the consolidated report.
      - name: Upload report section
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-validate
          path: ${{ runner.temp }}/report-validate.txt
          retention-days: 1
          if-no-files-found: ignore
