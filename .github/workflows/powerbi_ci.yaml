name: "Continous Integration For PowerBI"
run-name: "Power BI CI - PR #${{ inputs.pr || github.event.pull_request.number }}"
 
on:

    workflow_dispatch:

        inputs:

            pr:
                description: Number of the pull request this run validates.
                type: string
                required: true

            base:
                description: Branch the pull request targets.
                type: string
                required: false
                default: main

            request_id:
                description: Delivery ID from the zip intake; names the report.
                type: string
                required: false
                default: ""
 
    pull_request:
 
        branches:
 
            - main
            - sandbox
 
        paths-ignore:
            - 'src/**'
            - '.github/**'
            - 'pyproject.toml'
            - 'README.md'
            - 'doc/*'
            - '.gitignore'
            - 'uv.lock'
 
 
permissions:
  contents: read
 
jobs:
 
    scope:
 
        uses: ./.github/workflows/scope.yaml
        with:
            base_ref: origin/${{ github.base_ref || inputs.base || 'main' }}
       
    validate_artefacts:
 
        needs: scope
 
        if: needs.scope.outputs.has_changes == 'true'
 
        uses: ./.github/workflows/validate_powerbi.yaml
        with:
            workspace: ${{ needs.scope.outputs.workspace }}
            semantic_models: ${{ needs.scope.outputs.semantic_models }}
            reports: ${{ needs.scope.outputs.reports }}
 
    bpa-rules:

        needs:
            - scope
            - validate_artefacts

        
        if: needs.scope.outputs.has_changes == 'true' && needs.scope.outputs.semantic_models != '[]'

        uses: ./.github/workflows/bpa_powerbi.yaml
        with:
            semantic_models: ${{ needs.scope.outputs.semantic_models }}
            environment: prod

   
    gate:

        needs:
            - scope
            - validate_artefacts
            - bpa-rules

        if: always()

        permissions:
            contents: write
            pull-requests: write
            actions: write
            id-token: write

        uses: ./.github/workflows/gate_powerbi.yaml
        with:
            needs: ${{ toJSON(needs) }}
            pr: ${{ inputs.pr || github.event.pull_request.number }}
            request_id: ${{ inputs.request_id }}