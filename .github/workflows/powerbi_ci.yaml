name: "Continous Integration For PowerBI"

on:

    pull_request:

        branches:

            - main
            - sandbox

        paths-ignore:
            - 'src/**'
            - '.github/**'
            - 'pyproject.toml'
            - 'README.md'


permissions:
  contents: read

jobs:

    scope:

        uses: ./.github/workflows/scope.yaml
        with:
            base_ref: origin/${{ github.base_ref }}
       

    echo-scope:
        runs-on: ubuntu-latest
        needs: scope
        env:
            WORKSPACE: ${{needs.scope.outputs.workspace}}
            HAS_CHANGES: ${{needs.scope.outputs.has_changes}}
            SEMANTIC_MODELS: ${{needs.scope.outputs.semantic_models}}
            REPORTS: ${{needs.scope.outputs.reports}}
        steps:
            - name: Printing GITHUB_OUTPUT
              run: |
                echo "workspace = $WORKSPACE "
                echo "has_changes = $HAS_CHANGES "
                echo "semantic_models = $SEMANTIC_MODELS "
                echo "reports = $REPORTS "





