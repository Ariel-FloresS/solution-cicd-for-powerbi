name: "Continous Integration For PowerBI"

on:

    pull_request:

        branches:

            - main
            - sandbox

        paths-ignore:
            - 'src/**'
            - '.github/**'
            - 'pyproject.toml'
            - 'README.md'


permissions:
  contents: read

jobs:

    scope:

        uses: ./.github/workflows/scope.yaml
        with:
            base_ref: origin/${{ github.base_ref }}
       
    validate_artefacts:

        needs: scope

        if: needs.scope.outputs.has_changes == 'true'

        uses: ./.github/workflows/validate_powerbi.yaml
        with:
            workspace: ${{ needs.scope.outputs.workspace }}
            semantic_models: ${{ needs.scope.outputs.semantic_models }}
            reports: ${{ needs.scope.outputs.reports }}

    gate:
        needs: [scope, validate_artefacts]
        if: always()
        runs-on: ubuntu-latest
 
        steps:
            - name: Check upstream results
              env:
                SCOPE_RESULT: ${{ needs.scope.result }}
                VALIDATE_RESULT: ${{ needs.validate_artefacts.result }}
                
              run: |
                echo "scope    = $SCOPE_RESULT"
                echo "validate = $VALIDATE_RESULT"
        
                for result in "$SCOPE_RESULT" "$VALIDATE_RESULT"; do
                    if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
                    echo "::error::A required job did not pass."
                    exit 1
                    fi
                done
        
                echo "All required jobs passed."



    





