name: "Continous Integration For PowerBI"
 
on:
 
    pull_request:
 
        branches:
 
            - main
            - sandbox
 
        paths-ignore:
            - 'src/**'
            - '.github/**'
            - 'pyproject.toml'
            - 'README.md'
            - 'doc/*'
            - '.gitignore'
            - 'uv.lock'
 
 
permissions:
  contents: read
 
jobs:
 
    scope:
 
        uses: ./.github/workflows/scope.yaml
        with:
            base_ref: origin/${{ github.base_ref }}
       
    validate_artefacts:
 
        needs: scope
 
        if: needs.scope.outputs.has_changes == 'true'
 
        uses: ./.github/workflows/validate_powerbi.yaml
        with:
            workspace: ${{ needs.scope.outputs.workspace }}
            semantic_models: ${{ needs.scope.outputs.semantic_models }}
            reports: ${{ needs.scope.outputs.reports }}
 
    bpa-rules:

        needs:
            - scope
            - validate_artefacts

        
        if: needs.scope.outputs.has_changes == 'true' && needs.scope.outputs.semantic_models != '[]'

        uses: ./.github/workflows/bpa_powerbi.yaml
        with:
            semantic_models: ${{ needs.scope.outputs.semantic_models }}
            environment: prod

   
    gate:

        needs:
            - scope
            - validate_artefacts
            - bpa-rules

        if: always()

        permissions:
            contents: write
            pull-requests: write
            actions: write

        uses: ./.github/workflows/gate_powerbi.yaml
        with:
            needs: ${{ toJSON(needs) }}
